
services:
  redis:
    image: redis:7.2-alpine
    container_name: EasyCart_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: always
    ports:
      - "8001:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      - redis
  
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: EasyCart-rabbitmq
    ports:
      # RabbitMQ Broker port (MassTransit connects here)
      - "5672:5672"
      # RabbitMQ Management Web UI port
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      # Optional: Persists RabbitMQ data so queues aren't lost when the container stops
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: easycart-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"

volumes:
  redis_data:
  redis_insight_data:
  rabbitmq_data: