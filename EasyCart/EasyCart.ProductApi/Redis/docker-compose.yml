version: '3.8'

services:
  # Your existing postgres service goes here...

  redis:
    image: redis:7.2-alpine
    platform: linux/arm64
    container_name: EasyCart_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: always
    ports:
      - "8001:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      - redis

volumes:
  # Your existing postgres volumes...
  redis_data:
  redis_insight_data: