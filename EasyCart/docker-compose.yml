
services:
  redis:
    image: redis:7.4-alpine
    container_name: EasyCart_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:2.70.1
    container_name: redis_insight
    restart: always
    ports:
      - "8001:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      - redis
  
  rabbitmq:
    image: rabbitmq:3.13.6-management
    container_name: EasyCart-rabbitmq
    ports:
      # RabbitMQ Broker port (MassTransit connects here)
      - "5672:5672"
      # RabbitMQ Management Web UI port
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      # Optional: Persists RabbitMQ data so queues aren't lost when the container stops
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: easycart-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"

  product-api:
    build:
      context: .
      dockerfile: EasyCart.ProductApi/Dockerfile

    container_name: easycart-product

    ports:
      - "5001:8080"

    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      jaeger:
        condition: service_started

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__RedisConnection: ${REDIS_CONNECTION}

      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}

      OpenTelemetry__Endpoint: http://jaeger:4317

  order-api:
    build:
      context: .
      dockerfile: EasyCart.OrderApi/Dockerfile

    container_name: easycart-order

    ports:
      - "5002:8080"

    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      jaeger:
        condition: service_started

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ApiGateway__BaseUrl: ${API_GATEWAY_BASEURL}

      ConnectionStrings__RedisConnection: ${REDIS_CONNECTION}

      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}

      OpenTelemetry__Endpoint: http://jaeger:4317

  inventory-api:
    build:
      context: .
      dockerfile: EasyCart.InventoryApi/Dockerfile

    container_name: easycart-inventory

    ports:
      - "5004:8080"

    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      jaeger:
        condition: service_started

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__RedisConnection: ${REDIS_CONNECTION}

      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}

      OpenTelemetry__Endpoint: http://jaeger:4317

  auth-api:
    build:
      context: .
      dockerfile: EasyCart.AuthApi/Dockerfile

    container_name: easycart-auth

    ports:
      - "5000:8080"

    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      jaeger:
        condition: service_started

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__RedisConnection: ${REDIS_CONNECTION}

      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}

      OpenTelemetry__Endpoint: http://jaeger:4317

  api-gateway:
    build:
      context: .
      dockerfile: EasyCart.ApiGateway/Dockerfile

    container_name: easycart-api-gateway

    ports:
      - "5003:8080"

    depends_on:
      jaeger:
        condition: service_started
      auth-api:
        condition: service_started
      product-api:
        condition: service_started
      order-api:
        condition: service_started
      inventory-api:
        condition: service_started

    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production

      OpenTelemetry__Endpoint: http://jaeger:4317

volumes:
  redis_data:
  redis_insight_data:
  rabbitmq_data:
